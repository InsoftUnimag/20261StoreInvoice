spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/store_invoice_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: recibirPedido;processFinalState
    stream:
      bindings:
        processFinalState-in-0:
          destination: estadopedido
          group: estadopedido
          consumer:
            max-attempts: 3
        recibirPedido-in-0:
          destination: pedidos.inventario
          group: pedidos.inventario
          consumer:
            max-attempts: 3
      rabbit:
        bindings:
          processFinalState-in-0:
            consumer:
              queueNameGroupOnly: true
              declareExchange: false
              bindQueue: false
              auto-bind-dlq: true
              dlq-name: estado.final.transporte.dlq.test
              republish-to-dlq: true
          recibirPedido-in-0:
            consumer:
              queueNameGroupOnly: true
              declareExchange: false
              bindQueue: false
              auto-bind-dlq: true
              dlq-name: pedidos.inventario.dlq.test
              republish-to-dlq: true

logging:
  level:
    com.storeinvoice: DEBUG
    org.springframework.cloud.stream: DEBUG
