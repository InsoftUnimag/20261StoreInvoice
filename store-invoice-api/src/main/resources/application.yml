spring:
  application:
    name: store-invoice-api
  main:
    web-application-type: reactive
  cloud:
    stream:
      bindings:
        processFinalState-in-0:
          destination: estado.final.transporte
          group: store-invoice-group
          consumer:
            max-attempts: 3
      rabbit:
        bindings:
          processFinalState-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
              dlq-name: estado.final.transporte.dlq
  datasource:
    url: jdbc:postgresql://localhost:5432/store_invoice
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: false

server:
  port: 8080

external:
  cliente:
    module:
      base-url: ${CLIENTE_MODULE_URL:http://localhost:8081}

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 5000
        loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      clienteService:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      clienteService:
        maxAttempts: 3
        waitDuration: 500ms

logging:
  level:
    com.storeinvoice: INFO
    com.storeinvoice.store_invoice_api.infrastructure.adapter.outbound.external: DEBUG